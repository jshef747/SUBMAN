server {
    listen 80;
    
    # 1. Serve the React App (Frontend)
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # 2. Proxy API requests to the Backend (Internal Cluster DNS)
    location /api/ {
        # The trailing slash is CRITICAL. It strips '/api/' from the URL.
        # Request: http://frontend-ip/api/healthz -> http://subman-api:3000/healthz
        proxy_pass http://subman-api.subman.svc.cluster.local:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}