server {
    listen 80;

    # Use CoreDNS for runtime resolution (prevents startup failure if API isn't ready yet)
    resolver 10.96.0.10 valid=10s ipv6=off;

    # 1. Serve the React App (Frontend)
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # 2. Proxy API requests to the Backend (Internal Cluster DNS)
    location /api/ {
        set $upstream http://subman-api:3000;
        proxy_pass $upstream/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}