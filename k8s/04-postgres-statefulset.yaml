apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: subman
spec:
  serviceName: "postgres-headless"
  replicas: 1 # "Single replica" requirement
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:15
          ports:
            - containerPort: 5432
          # Load env vars (DB name, User) from ConfigMap
          envFrom:
            - configMapRef:
                name: subman-config
          # Load Password specifically from Secret
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: subman-secrets
                  key: DB_PASSWORD
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
  # This automatically creates a Persistent Volume for the DB
  volumeClaimTemplates:
    - metadata:
        name: postgres-storage
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
