apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  - postgres-statefulset.yaml  # <--- MUST BE HERE, NOT IN PATCHES
  - backup-cronjob.yaml

patches:
  # 1. Update the Service to be Headless
  - path: postgres-service.yaml
    target:
      kind: Service
      name: postgres

  # 2. Disable the old Deployment (Scale to 0)
  - target:
      kind: Deployment
      name: postgres
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 0