apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres-stateful
  namespace: subman
  labels:
    app: postgres
spec:
  serviceName: "postgres"
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:15-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_PASSWORD
              value: "local_secure_password"
            # --- START OF FIX ---
            - name: POSTGRES_USER
              value: "user"
            - name: POSTGRES_DB
              value: "subman"
            # --- END OF FIX ---
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi