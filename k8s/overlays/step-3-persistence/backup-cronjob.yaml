apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-backup
  namespace: subman
spec:
  schedule: "0 2 * * *" # Runs every night at 2:00 AM
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: backup
            image: postgres:15-alpine
            # Connects to the postgres host and dumps data to a dummy location (simulation)
            command:
            - /bin/sh
            - -c
            - |
              echo "Starting backup..."
              PGPASSWORD='local_secure_password' pg_dump -h postgres -U postgres postgres > /tmp/backup_$(date +%Y%m%d).sql
              echo "Backup complete: /tmp/backup_$(date +%Y%m%d).sql"
          restartPolicy: OnFailure