apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-{{ .Values.postgres.name }}
  namespace: subman
spec:
  clusterIP: None
  ports:
    - port: {{ .Values.postgres.service.port }}
      protocol: TCP
      targetPort: {{ .Values.postgres.service.port }}
  selector:
    app: {{ .Release.Name }}-{{ .Values.postgres.name }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-{{ .Values.api.name }}
  namespace: subman
spec:
  ports:
    - port: {{ .Values.api.service.port }}
      protocol: TCP
      targetPort: {{ .Values.api.service.port }}
  selector:
    app: {{ .Release.Name }}-{{ .Values.api.name }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-{{ .Values.client.name }}
  namespace: subman
spec:
  ports:
    - port: {{ .Values.client.service.port }}
      protocol: TCP
      targetPort: {{ .Values.client.service.port }}
  selector:
    app: {{ .Release.Name }}-{{ .Values.client.name }}
  type: {{ .Values.client.service.type }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-{{ .Values.postgres.name }}
  namespace: subman
spec:
  replicas: 0
  selector:
    matchLabels:
      app: {{ .Release.Name }}-{{ .Values.postgres.name }}
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-{{ .Values.postgres.name }}
    spec:
      containers:
        - env:
            - name: POSTGRES_USER
              value: {{ .Values.database.user }}
            - name: POSTGRES_PASSWORD
              value: password
            - name: POSTGRES_DB
              value: subman
          image: "{{ .Values.postgres.image.repository }}:{{ .Values.postgres.image.tag }}"
          imagePullPolicy: {{ .Values.postgres.image.pullPolicy }}
          name: postgres
          ports:
            - containerPort: {{ .Values.postgres.service.port }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-{{ .Values.api.name }}
  namespace: subman
spec:
  replicas: {{ .Values.api.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}-{{ .Values.api.name }}
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-{{ .Values.api.name }}
    spec:
      containers:
        - env:
            - name: PORT
              value: {{ .Values.api.service.port | quote }}
          envFrom:
            - secretRef:
                name: subman-secrets
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.api.service.port }}
            initialDelaySeconds: 15
            periodSeconds: 10
          name: subman-api
          ports:
            - containerPort: {{ .Values.api.service.port }}
          readinessProbe:
            httpGet:
              path: /readinessz
              port: {{ .Values.api.service.port }}
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
      initContainers:
        - command:
            - sh
            - -c
            - until nc -z {{ .Release.Name }}-{{ .Values.postgres.name }} {{ .Values.postgres.service.port }}; do echo waiting for postgres; sleep 2; done
          image: busybox
          name: wait-for-postgres
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-{{ .Values.client.name }}
  namespace: subman
spec:
  replicas: {{ .Values.client.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}-{{ .Values.client.name }}
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-{{ .Values.client.name }}
    spec:
      containers:
        - image: "{{ .Values.client.image.repository }}:{{ .Values.client.image.tag }}"
          imagePullPolicy: {{ .Values.client.image.pullPolicy }}
          name: subman-client
          ports:
            - containerPort: {{ .Values.client.service.port }}
          resources:
            {{- toYaml .Values.client.resources | nindent 12 }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  labels:
    app: {{ .Release.Name }}-{{ .Values.postgres.name }}
  name: {{ .Release.Name }}-{{ .Values.postgres.name }}-stateful
  namespace: subman
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Release.Name }}-{{ .Values.postgres.name }}
  serviceName: {{ .Release.Name }}-{{ .Values.postgres.name }}
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-{{ .Values.postgres.name }}
    spec:
      containers:
        - env:
            - name: POSTGRES_PASSWORD
              value: local_secure_password
            - name: POSTGRES_USER
              value: {{ .Values.database.user }}
            - name: POSTGRES_DB
              value: subman
          image: "{{ .Values.postgres.statefulImage.repository }}:{{ .Values.postgres.statefulImage.tag }}"
          imagePullPolicy: {{ .Values.postgres.statefulImage.pullPolicy }}
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - {{ .Values.database.user }}
            initialDelaySeconds: 30
            periodSeconds: 10
          name: postgres
          ports:
            - containerPort: {{ .Values.postgres.service.port }}
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - {{ .Values.database.user }}
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - mountPath: /var/lib/postgresql/data
              name: postgres-data
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: {{ .Values.database.storageSize }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ .Release.Name }}-postgres-backup
  namespace: subman
spec:
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - command:
                - /bin/sh
                - -c
                - |
                  echo "Starting backup..."
                  PGPASSWORD='local_secure_password' pg_dump -h {{ .Release.Name }}-{{ .Values.postgres.name }} -U {{ .Values.database.user }} subman > /tmp/backup_$(date +%Y%m%d).sql
                  echo "Backup complete: /tmp/backup_$(date +%Y%m%d).sql"
              image: "{{ .Values.postgres.statefulImage.repository }}:{{ .Values.postgres.statefulImage.tag }}"
              name: backup
          restartPolicy: OnFailure
  schedule: 0 2 * * *
---
{{- if .Values.api.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ .Release.Name }}-{{ .Values.api.name }}-hpa
  namespace: subman
spec:
  maxReplicas: {{ .Values.api.autoscaling.maxReplicas }}
  metrics:
    - resource:
        name: cpu
        target:
          averageUtilization: {{ .Values.api.autoscaling.targetCPUUtilizationPercentage }}
          type: Utilization
      type: Resource
  minReplicas: {{ .Values.api.autoscaling.minReplicas }}
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ .Release.Name }}-{{ .Values.api.name }}
{{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-protect-db
  namespace: subman
spec:
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: {{ .Release.Name }}-{{ .Values.api.name }}
      ports:
        - port: {{ .Values.postgres.service.port }}
          protocol: TCP
  podSelector:
    matchLabels:
      app: {{ .Release.Name }}-{{ .Values.postgres.name }}
  policyTypes:
    - Ingress
