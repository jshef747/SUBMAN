apiVersion: apps/v1
kind: Deployment
metadata:
  name: subman-api
  namespace: {{ .Release.Namespace }}
  labels:
    app: subman-api
spec:
  replicas: {{ .Values.api.replicaCount }}
  selector:
    matchLabels:
      app: subman-api
  template:
    metadata:
      labels:
        app: subman-api
    spec:
      initContainers:
      - name: wait-for-postgres
        image: busybox
        command: ['sh', '-c', 'until nc -z postgres-headless 5432; do echo waiting for postgres; sleep 2; done']
      - name: db-migration
        image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
        imagePullPolicy: {{ .Values.api.image.pullPolicy }}
        command: ["npx", "prisma", "migrate", "deploy"]
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: subman-secrets
              key: DATABASE_URL
      containers:
      - name: subman-api
        image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
        imagePullPolicy: {{ .Values.api.image.pullPolicy }}
        ports:
        - containerPort: {{ .Values.api.service.port }}
        envFrom:
        - configMapRef:
            name: subman-config
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: subman-secrets
              key: DATABASE_URL
        livenessProbe:
          httpGet:
            path: /healthz
            port: {{ .Values.api.service.port }}
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /readinessz
            port: {{ .Values.api.service.port }}
          initialDelaySeconds: 5
          periodSeconds: 10