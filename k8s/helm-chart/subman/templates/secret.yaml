apiVersion: v1
kind: Secret
metadata:
  name: subman-secrets
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  DB_PASSWORD: {{ .Values.postgres.dbPassword | quote }}
  DATABASE_URL: "postgresql://{{ .Values.postgres.dbUser }}:{{ .Values.postgres.dbPassword }}@postgres-headless:5432/{{ .Values.postgres.dbName }}"
  SUPABASE_URL: "https://dummy.supabase.co"
  SUPABASE_KEY: "dummy-key"