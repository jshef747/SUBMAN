apiVersion: v1
kind: Secret
metadata:
  name: subman-secrets
  namespace: {{ .Release.Namespace }}
type: Opaque

stringData:
  DB_PASSWORD: {{ .Values.postgres.dbPassword | quote }}
  DATABASE_URL: "postgresql://{{ .Values.postgres.dbUser }}:{{ .Values.postgres.dbPassword }}@postgres-headless.{{ .Release.Namespace }}:5432/{{ .Values.postgres.dbName }}"
